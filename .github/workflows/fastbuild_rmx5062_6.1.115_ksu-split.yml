name: 6.1.115 realme Neo7 Turbo 官方内核特供 RMX5062_15.0.1.971(CN01) KSU分流版

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  SUB_VERSION: '115'
  DEVICE_MODEL: 'RMX5062'
  DEVICE_NAME: 'realme Neo7 Turbo'
  DEVICE_BOARD: 'RE602EL1'
  KERNEL_NAME: 'android14-11-o-gbc8558aaf2a5'
  SOURCE_REPO: 'realme-kernel-opensource/realme_neo7_turbo-AndroidV-kernel-source'
  SOURCE_REF: 'master'
  SOURCE_DIR: 'realme_neo7_turbo-AndroidV-kernel-source-master'
  CCACHE_KEY: ccache-rmx5062-android14-6.1.115

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支(ReSukiSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认SukiSU Ultra)'
        required: true
        type: choice
        default: 'sukisu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      root_manager:
        description: 'Root管理器集成(default-启用Manager识别和App授权; none-禁用Manager识别/签名逻辑，SukiSU授权App root请勿选择)'
        required: true
        type: choice
        default: 'default'
        options:
          - 'default'
          - 'none'
      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: '是否开启kpm(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: true
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: true
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: '是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default设为默认)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'standard'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: true
      ssg_enable:
        description: '是否启用三星SSG IO调度器支持(提升IO读写性能; 在一加12上可能导致bug)'
        required: true
        type: boolean
        default: true
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: true
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: true
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: true
      release_enable:
        description: '是否创建 GitHub Release(默认关闭，只上传 artifact)'
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
      full_version: ${{ steps.create_zip.outputs.full_version }}
      source_commit: ${{ steps.init.outputs.source_commit }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出当前构建脚本仓库
        uses: actions/checkout@v4

      - name: 安装环境依赖并初始化 RMX5062 官方源码和 llvm-Clang20 工具链
        id: init
        run: |
          set -euo pipefail
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          echo "目标设备：${{ env.DEVICE_NAME }} / ${{ env.DEVICE_MODEL }} / ${{ env.DEVICE_BOARD }}"
          echo "官方源码：${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_REF }}"

          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt update
          sudo apt-get install -y --no-install-recommends aria2 binutils python-is-python3 libssl-dev libelf-dev unzip zip ccache zstd pahole dwarves

          echo "正在安装 ccache-ECS..."
          cp "${{ github.workspace }}/lib/ccache-x86-64" ccache
          sudo cp -f ./ccache /usr/bin/ccache
          sudo chmod +x /usr/bin/ccache
          rm -f ./ccache

          echo "正在获取 RMX5062 官方源码提交..."
          SOURCE_COMMIT="$(git ls-remote "https://github.com/${{ env.SOURCE_REPO }}.git" "refs/heads/${{ env.SOURCE_REF }}" | awk '{print $1}')"
          if [[ -z "$SOURCE_COMMIT" ]]; then
            echo "无法获取官方源码提交，请检查 SOURCE_REPO/SOURCE_REF"
            exit 1
          fi
          echo "官方源码提交：$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

          echo "正在下载 RMX5062 官方源码..."
          aria2c -s16 -x16 -k1M "https://github.com/${{ env.SOURCE_REPO }}/archive/refs/heads/${{ env.SOURCE_REF }}.zip" -o common.zip
          unzip -q common.zip
          mv "${{ env.SOURCE_DIR }}" common
          rm -f common.zip

          echo "官方源码 build.config.constants："
          cat common/build.config.constants || true
          echo "官方源码 Makefile 版本："
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' common/Makefile || true

          echo "正在补齐 RMX5062 官方源码缺失的 Oplus Kconfig 占位..."
          prepare_oplus_placeholder() {
            local in_tree="$1"
            local vendor_target="$2"
            local name="$3"
            echo "处理 $name: $in_tree -> $vendor_target"
            mkdir -p "$vendor_target"
            : > "$vendor_target/Kconfig"
            : > "$vendor_target/Makefile"
            if [[ -L "$in_tree" ]]; then
              echo "检测到 $in_tree 是 symlink，目标为：$(readlink "$in_tree")"
              echo "已补齐 symlink 目标占位：$vendor_target"
            else
              if [[ -e "$in_tree" && ! -d "$in_tree" ]]; then
                echo "检测到 $in_tree 是普通文件占位，内容如下："
                cat "$in_tree" || true
                rm -f "$in_tree"
              fi
              mkdir -p "$in_tree"
              : > "$in_tree/Kconfig"
              : > "$in_tree/Makefile"
            fi
          }
          # drivers/soc/oplus/* 的源码占位目标形如 ../../../../vendor/...，从 common/drivers/soc/oplus 解析后位于 kernel_workspace/vendor/...。
          prepare_oplus_placeholder "common/drivers/soc/oplus/oplus_resctrl" "vendor/oplus/kernel/oplus_performance/oplus_resctrl" "oplus_resctrl"
          prepare_oplus_placeholder "common/drivers/soc/oplus/storage" "vendor/oplus/kernel/storage" "oplus_storage"
          # Kconfig.ext 会硬 source kernel/oplus_cpu/Kconfig；kernel/oplus_cpu 指向 ../../vendor/oplus/kernel/cpu。
          prepare_oplus_placeholder "common/kernel/oplus_cpu" "vendor/oplus/kernel/cpu" "oplus_cpu"

          echo "正在补齐 RMX5062 官方源码缺失的 Oplus locking 空实现..."
          # kernel/locking/locking_main.h 与 oplus_locking.c 指向 ../../../vendor/oplus/kernel/synchronize/。
          # 主线 locking/sched 代码会硬引用这些 Oplus hook；baseline 构建中用 no-op 实现保持原流程继续编译。
          mkdir -p vendor/oplus/kernel/synchronize
          cat > vendor/oplus/kernel/synchronize/oplus_locking.h <<'EOF'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _OPLUS_LOCKING_H
          #define _OPLUS_LOCKING_H

          struct task_struct;

          static inline void locking_record_switch_in_cs(struct task_struct *task) { }

          #endif
          EOF
          cat > vendor/oplus/kernel/synchronize/oplus_locking.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/export.h>
          #include <linux/types.h>

          #include "oplus_locking.h"

          struct mutex;
          struct percpu_rw_semaphore;
          struct rt_mutex_base;
          struct rw_semaphore;
          struct task_struct;

          void android_vh_pcpu_rwsem_handler(u64 sem, struct task_struct *tsk,
                                             unsigned long jiffies) { }
          EXPORT_SYMBOL_GPL(android_vh_pcpu_rwsem_handler);

          void mutex_lock_handler(u64 lock, struct task_struct *tsk, unsigned long jiffies) { }
          EXPORT_SYMBOL_GPL(mutex_lock_handler);

          void rwsem_lock_handler(u64 sem, struct task_struct *tsk, unsigned long jiffies) { }
          EXPORT_SYMBOL_GPL(rwsem_lock_handler);

          void mutex_wait_handler(struct mutex *lock) { }
          EXPORT_SYMBOL_GPL(mutex_wait_handler);

          void rwsem_read_wait_handler(struct rw_semaphore *sem) { }
          EXPORT_SYMBOL_GPL(rwsem_read_wait_handler);

          void pcp_wait_handler(struct percpu_rw_semaphore *sem, bool is_reader, int phase) { }
          EXPORT_SYMBOL_GPL(pcp_wait_handler);

          void rtmutex_lock_handler(u64 lock, struct task_struct *tsk,
                                    unsigned long jiffies) { }
          EXPORT_SYMBOL_GPL(rtmutex_lock_handler);

          void rtmutex_wait_handler(struct rt_mutex_base *lock) { }
          EXPORT_SYMBOL_GPL(rtmutex_wait_handler);
          EOF
          if [[ ! -L common/kernel/locking/locking_main.h ]]; then
            cp vendor/oplus/kernel/synchronize/oplus_locking.h common/kernel/locking/locking_main.h
          fi
          cp vendor/oplus/kernel/synchronize/oplus_locking.h common/kernel/locking/oplus_locking.h
          if [[ ! -L common/kernel/locking/oplus_locking.c ]]; then
            cp vendor/oplus/kernel/synchronize/oplus_locking.c common/kernel/locking/oplus_locking.c
          fi

          echo "正在补齐 RMX5062 官方源码缺失的 Oplus mm trace 空实现..."
          # mm/mm-trace.h 指向 ../../vendor/oplus/kernel/mm/mm_osvelte/mm-trace.h；vmscan.c 只需要这些 trace 接口存在。
          mkdir -p vendor/oplus/kernel/mm/mm_osvelte
          cat > vendor/oplus/kernel/mm/mm_osvelte/mm-trace.h <<'EOF'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _OPLUS_MM_TRACE_H
          #define _OPLUS_MM_TRACE_H

          #define mm_trace_int64(name, value) do { } while (0)
          #define mm_trace_fmt_begin(fmt, ...) do { } while (0)
          #define mm_trace_fmt_end() do { } while (0)

          #endif
          EOF
          if [[ ! -L common/mm/mm-trace.h ]]; then
            cp vendor/oplus/kernel/mm/mm_osvelte/mm-trace.h common/mm/mm-trace.h
          fi

          echo "正在下载 llvm-Clang20 工具链..."
          mkdir -p clang20
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/clang-r547379.zip -o clang.zip
          unzip -q clang.zip -d clang20
          rm -f clang.zip

          echo "正在下载构建工具..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip
          rm -f build-tools.zip

          echo "源码与工具链初始化完成。"
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_rmx5062_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入 RMX5062 ccache 缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 初始化并配置ccache
        run: |
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          ccache -s

      - name: 添加KernelSU
        id: ksu_version
        run: |
          set -euo pipefail
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            SUKISU_TAG="v4.1.3"
            KSU_VERSION=20296
            echo "正在配置 SukiSU Ultra ${SUKISU_TAG}..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/tags/${SUKISU_TAG}/kernel/setup.sh" | bash -s "${SUKISU_TAG}"
            cd ./KernelSU
            git fetch --tags --force
            git checkout -f "${SUKISU_TAG}"
            test "$(git describe --tags --exact-match HEAD)" = "${SUKISU_TAG}"
            SUKISU_COMMIT="$(git rev-parse --short=8 HEAD)"
            SUKISU_FULL_VERSION="${SUKISU_TAG}-${SUKISU_COMMIT}@${SUKISU_TAG}"
            sed -i "s|^REPO_BRANCH := .*|REPO_BRANCH := ${SUKISU_TAG}|" kernel/Kbuild
            sed -i "s|^KSU_GITHUB_VER   := .*|KSU_GITHUB_VER   := ${SUKISU_TAG#v}|" kernel/Kbuild
            sed -i 's|^GITHUB_COMMITS   := .*|GITHUB_COMMITS   := |' kernel/Kbuild
            sed -i "s|^KSU_VERSION     := .*|KSU_VERSION     := ${KSU_VERSION}|" kernel/Kbuild
            sed -i "s|^VERSION_TAG     := .*|VERSION_TAG     := ${SUKISU_TAG#v}|" kernel/Kbuild
            sed -i "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := ${SUKISU_FULL_VERSION}|" kernel/Kbuild
            grep -q "^KSU_VERSION     := ${KSU_VERSION}$" kernel/Kbuild
            grep -q "^VERSION_TAG     := ${SUKISU_TAG#v}$" kernel/Kbuild
            grep -q "^KSU_VERSION_FULL := ${SUKISU_FULL_VERSION}$" kernel/Kbuild
            echo "SukiSU Ultra 固定版本：${SUKISU_TAG}"
            echo "SukiSU Ultra 固定提交：${SUKISU_COMMIT}"
            echo "SukiSU Ultra 固定 Full Version：${SUKISU_FULL_VERSION}"
            echo "SukiSU Ultra 固定 KSUVER：${KSU_VERSION}"
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "SUKISU_TAG=$SUKISU_TAG" >> $GITHUB_ENV
            echo "SUKISU_KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
            echo "SUKISU_FULL_VERSION=$SUKISU_FULL_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.ksu_type }}" == "resukisu" ]]; then
            echo "正在配置 ReSukiSU..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@rmx5062"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksunext" ]]; then
            echo "正在配置KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            cd ../common/drivers/kernelsu
            cp "${{ github.workspace }}/other_patch/apk_sign.patch" ./apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置。"
            echo "KSUVER=none" >> $GITHUB_ENV
            echo "ksuver=none" >> $GITHUB_OUTPUT
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          set -euo pipefail
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" != "none" ]]; then
            echo "正在添加susfs补丁..."
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            cp "${{ github.workspace }}/other_patch/69_hide_stuff.patch" ./common/69_hide_stuff.patch
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            cd ./common
            patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true
            cd ..
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置。"
          fi
          if [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            cd ./KernelSU
            patch -p1 < 10_enable_susfs_for_ksu.patch
          elif [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            echo "正在为 SukiSU v4.1.3 应用 SUSFS 真实接口适配..."
            echo "保留 susfs4oki 的 OKI GKI 补丁；不再叠加 syscall_hooks.patch，避免 fs/open.c 等双重 hook 类型冲突。"
            python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def read(path):
              return Path(path).read_text()

          def write(path, data):
              Path(path).write_text(data)

          def replace(path, old, new):
              p = Path(path)
              data = p.read_text()
              if old not in data:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              p.write_text(data.replace(old, new))

          def append_once(path, marker, text):
              p = Path(path)
              data = p.read_text()
              if marker not in data:
                  p.write_text(data.rstrip() + "\n\n" + text.strip() + "\n")

          # susfs4oki 的 GKI patch 使用 static_key_true ABI；SukiSU v4.1.3 原生 sucompat 是 bool。
          # 这里只在 common 已打补丁源码中把判断桥接回 SukiSU 原生 bool，避免改动原 SukiSU feature 开关模型。
          for rel in ("common/fs/exec.c", "common/fs/open.c", "common/fs/stat.c"):
              p = Path(rel)
              data = p.read_text()
              data = data.replace("extern struct static_key_true ksu_su_compat_enabled;", "extern bool ksu_su_compat_enabled;")
              data = data.replace("static_branch_likely(&ksu_su_compat_enabled)", "ksu_su_compat_enabled")

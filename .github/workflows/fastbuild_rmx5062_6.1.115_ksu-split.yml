              endmenu''') + tail)

          replace(
              "KernelSU/kernel/core/init.c",
              "#include \"feature/uts_spoof.h\"\n#include \"infra/symbol_resolver.h\"",
              "#include \"feature/uts_spoof.h\"\n#include \"infra/symbol_resolver.h\"\n\n#ifdef CONFIG_KSU_SUSFS\nextern void susfs_init(void);\n#endif",
          )
          replace(
              "KernelSU/kernel/core/init.c",
              "    ksu_syscall_hook_init();\n\n    ksu_feature_init();",
              "    ksu_syscall_hook_init();\n\n#ifdef CONFIG_KSU_SUSFS\n    susfs_init();\n#endif\n\n    ksu_feature_init();",
          )

          append_once("KernelSU/kernel/feature/sucompat.c", "sukisu_susfs_sucompat_stubs", r'''
          #ifdef CONFIG_KSU_SUSFS
          /*
           * sukisu_susfs_sucompat_stubs
           *
           * susfs4oki 的 GKI 补丁面向原版 KernelSU，那套实现里这几个 ksu_handle_* 是 su
           * 拦截的唯一入口。SukiSU v4.1.3 换了架构，已经用 tracepoint syscall hook 原生
           * 实现了同一套拦截（见 hook/syscall_event_bridge.c 与本文件的 *_sucompat 系列）。
           *
           * 因此这里只提供 susfs 补丁链接所需的符号，函数体不得再做一遍 su -> ksud/sh 改写，
           * 也不得再走一遍 root profile 逃逸。重复执行会破坏 SukiSU 的 Manager 识别与
           * App Profile 授权链路，表现为「SUSFS 正常但无法给其它应用授权 root」。
           *
           * 注意：这不是空实现掩盖问题。SUSFS 自身的功能函数（susfs_init、sus_path、
           * sus_kstat、uname 伪装、reboot 命令分发等）都是真实实现，不在此列。
           */
          int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags)
          {
              return 0;
          }

          int ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode, int *__unused_flags)
          {
              return 0;
          }

          int ksu_handle_stat(int *dfd, struct filename **filename, int *flags)
          {
              return 0;
          }
          #endif
          ''')

          replace(
              "KernelSU/kernel/runtime/ksud_integration.c",
              "#include <linux/stat.h>",
              "#include <linux/stat.h>\n#include <linux/jump_label.h>",
          )
          replace(
              "KernelSU/kernel/runtime/ksud_integration.c",
              "static void stop_init_rc_hook();",
              "#ifdef CONFIG_KSU_SUSFS\nDEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);\nDEFINE_STATIC_KEY_TRUE(ksu_is_input_hook_enabled);\n#endif\n\nstatic void stop_init_rc_hook();",
          )
          # SukiSU 原生 ksu_handle_sys_read 是 static 三参数函数，susfs 需要同名单参数函数，
          # 同一文件内会符号冲突，因此把原生的改名，仅用于保留 SukiSU 自身的 init.rc 注入调用。
          replace(
              "KernelSU/kernel/runtime/ksud_integration.c",
              "static void ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr)",
              "static void ksu_handle_sys_read_sukisu(unsigned int fd, char __user **buf_ptr, size_t *count_ptr)",
          )
          replace(
              "KernelSU/kernel/runtime/ksud_integration.c",
              "    ksu_handle_sys_read(fd, buf_ptr, count_ptr);\n    return orig_sys_read(regs);",
              "    ksu_handle_sys_read_sukisu(fd, buf_ptr, count_ptr);\n    return orig_sys_read(regs);",
          )
          replace(
              "KernelSU/kernel/runtime/ksud_integration.c",
              "static void stop_init_rc_hook()\n{\n    ksu_syscall_table_unhook(__NR_read);",
              "static void stop_init_rc_hook()\n{\n#ifdef CONFIG_KSU_SUSFS\n    if (static_key_enabled(&ksu_is_init_rc_hook_enabled))\n        static_branch_disable(&ksu_is_init_rc_hook_enabled);\n#endif\n    ksu_syscall_table_unhook(__NR_read);",
          )
          replace(
              "KernelSU/kernel/runtime/ksud_integration.c",
              "    input_hook_stopped = true;\n    bool ret = schedule_work(&stop_input_hook_work);",
              "    input_hook_stopped = true;\n#ifdef CONFIG_KSU_SUSFS\n    if (static_key_enabled(&ksu_is_input_hook_enabled))\n        static_branch_disable(&ksu_is_input_hook_enabled);\n#endif\n    bool ret = schedule_work(&stop_input_hook_work);",
          )
          append_once("KernelSU/kernel/runtime/ksud_integration.c", "sukisu_susfs_init_rc_stubs", r'''
          #ifdef CONFIG_KSU_SUSFS
          /*
           * sukisu_susfs_init_rc_stubs
           *
           * susfs4oki 的 fs/read_write.c 与 fs/stat.c 会调用这两个符号，用来在原版 KernelSU
           * 上完成 init.rc 注入并同步 stat 报告的文件长度。SukiSU v4.1.3 自己就 hook 了
           * __NR_read（见 stop_init_rc_hook 中的 ksu_syscall_table_unhook(__NR_read)），
           * 已经在做同一份注入。
           *
           * 这里只提供符号，不再转发到 SukiSU 的注入逻辑，也不再修改 kstat_size。重复注入会
           * 让 init.rc 内容与 stat 长度同时出错，直接影响 ksud 启动和 Manager 服务。
           */
          void ksu_handle_sys_read(unsigned int fd)
          {
          }

          void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr)
          {
          }
          #endif
          ''')

          append_once("KernelSU/kernel/hook/setuid_hook.c", "sukisu_handle_setresuid_susfs", r'''
          #ifdef CONFIG_KSU_SUSFS
          #include <linux/susfs_def.h>
          #include <linux/workqueue.h>

          extern struct work_struct susfs_extra_works;

          static void sukisu_susfs_schedule_extra_work(void)
          {
              if (!work_pending(&susfs_extra_works))
                  schedule_work(&susfs_extra_works);
          }

          /*
           * sukisu_handle_setresuid_susfs
           *
           * susfs4oki 把这个 hook 插在 __sys_setresuid() 的入口，也就是凭证尚未变更时，
           * 且无论 setresuid 最终成功还是失败都会调用一次。
           *
           * SukiSU v4.1.3 的契约完全不同：ksu_hook_setresuid 会先执行真正的 syscall，
           * 失败直接返回，成功之后才用 (old_uid, current_uid()) 调用一次 SukiSU 自己的两参数
           * setresuid 处理函数，在那里完成 Manager fd 安装、seccomp reboot allow、
           * tracepoint flag 维护和 kernel umount。
           *
           * 所以这里绝不能再调用 SukiSU 的两参数 setresuid 处理函数，否则那整套授权状态机
           * 每次 setresuid 都会跑两遍，其中一遍还在错误的凭证上下文里，会破坏 Manager 识别和
           * App Profile 授权。这个函数只负责 SUSFS 自己的隐藏标记。
           */
          int sukisu_handle_setresuid_susfs(uid_t ruid, uid_t euid, uid_t suid)
          {
              uid_t new_uid = (uid_t)-1;

              if (euid != (uid_t)-1)
                  new_uid = euid;
              else if (ruid != (uid_t)-1)
                  new_uid = ruid;
              else if (suid != (uid_t)-1)
                  new_uid = suid;

              if (new_uid == (uid_t)-1)
                  return 0;

              /* Manager 与已授权 UID 不打任何 SUSFS 标记，避免挡住 su 授权链路。 */
              if (is_uid_manager(new_uid) || ksu_is_allow_uid_for_current(new_uid))
                  return 0;

              if (is_isolated_process(new_uid)) {
                  susfs_set_current_proc_no_su();
                  susfs_set_current_proc_umounted();
                  sukisu_susfs_schedule_extra_work();
              } else if (unlikely(new_uid == WEBVIEW_ZYGOTE_UID)) {
                  if (ksu_uid_should_umount(new_uid)) {
                      susfs_set_current_proc_no_su();
                      susfs_set_current_proc_umounted();
                      sukisu_susfs_schedule_extra_work();
                  } else {
                      susfs_set_current_proc_no_su();
                  }
              } else if (likely(is_appuid(new_uid)) && ksu_uid_should_umount(new_uid)) {
                  susfs_set_current_proc_no_su();
                  susfs_set_current_proc_umounted();
                  sukisu_susfs_schedule_extra_work();
              } else {
                  susfs_set_current_proc_no_su();
              }

              return 0;
          }
          #endif
          ''')

          append_once("KernelSU/kernel/selinux/selinux.c", "susfs_is_current_ksu_domain", r'''
          #ifdef CONFIG_KSU_SUSFS
          bool susfs_is_current_ksu_domain(void)
          {
              return is_ksu_domain();
          }
          #endif
          ''')

          append_once("KernelSU/kernel/supercall/supercall.c", "ksu_handle_sys_reboot", r'''
          #ifdef CONFIG_KSU_SUSFS
          #include <linux/cred.h>
          #include <linux/susfs.h>
          #include <linux/susfs_def.h>

          int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg)
          {
              if (magic1 != KSU_INSTALL_MAGIC1)
                  return 1;

              if (magic2 == SUSFS_MAGIC && current_uid().val == 0) {
                  switch (cmd) {
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
                  case CMD_SUSFS_ADD_SUS_PATH:
                      susfs_add_sus_path(arg);
                      return 0;
                  case CMD_SUSFS_ADD_SUS_PATH_LOOP:
                      susfs_add_sus_path_loop(arg);
                      return 0;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
                  case CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS:
                      susfs_set_hide_sus_mnts_for_non_su_procs(arg);
                      return 0;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
                  case CMD_SUSFS_ADD_SUS_KSTAT:
                  case CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:
                      susfs_add_sus_kstat(arg);
                      return 0;
                  case CMD_SUSFS_UPDATE_SUS_KSTAT:
                      susfs_update_sus_kstat(arg);
                      return 0;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
                  case CMD_SUSFS_SET_UNAME:
                      susfs_set_uname(arg);
                      return 0;
          #endif
          #ifdef CONFIG_KSU_SUSFS_ENABLE_LOG
                  case CMD_SUSFS_ENABLE_LOG:
                      susfs_enable_log(arg);
                      return 0;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
                  case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:
                      susfs_set_cmdline_or_bootconfig(arg);
                      return 0;
          #endif
          #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT
                  case CMD_SUSFS_ADD_OPEN_REDIRECT:
                      susfs_add_open_redirect(arg);
                      return 0;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
                  case CMD_SUSFS_ADD_SUS_MAP:
                      susfs_add_sus_map(arg);
                      return 0;
          #endif
                  case CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING:
                      susfs_set_avc_log_spoofing(arg);
                      return 0;
                  case CMD_SUSFS_SHOW_ENABLED_FEATURES:
                      susfs_get_enabled_features(arg);
                      return 0;
                  case CMD_SUSFS_SHOW_VARIANT:
                      susfs_show_variant(arg);
                      return 0;
                  case CMD_SUSFS_SHOW_VERSION:
                      susfs_show_version(arg);
                      return 0;
                  default:
                      return 1;
                  }
              }

              return 1;
          }
          #endif
          ''')
          PY
            echo "====== SukiSU SUSFS 适配自检：确认未重复执行 SukiSU 原生授权链路 ======"
            # SukiSU v4.1.3 已用 tracepoint hook 原生实现 su 拦截、init.rc 注入和 setresuid
            # 授权状态机。susfs 侧只提供符号，不得再做一遍，否则 App Profile 授权会失效。
            ! grep -qE 'escape_with_root_profile|ksu_handle_execveat_ksud' <(sed -n '/sukisu_susfs_sucompat_stubs/,$p' KernelSU/kernel/feature/sucompat.c) || {
              echo "错误：sucompat.c 的 susfs 适配块重复执行了 SukiSU 原生 su 拦截逻辑"; exit 1; }
            ! grep -q 'ksu_handle_setresuid(' <(sed -n '/sukisu_handle_setresuid_susfs/,$p' KernelSU/kernel/hook/setuid_hook.c) || {
              echo "错误：setuid_hook.c 的 susfs 适配块重复调用了 SukiSU 原生 ksu_handle_setresuid"; exit 1; }
            ! grep -q 'ksu_handle_sys_read_sukisu' <(sed -n '/sukisu_susfs_init_rc_stubs/,$p' KernelSU/kernel/runtime/ksud_integration.c) || {
              echo "错误：ksud_integration.c 的 susfs 适配块重复执行了 SukiSU 原生 init.rc 注入"; exit 1; }
            grep -q 'ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);' common/fs/exec.c || {
              echo "错误：common/fs/exec.c 的 sucompat 调用名被改写，SukiSU 原生 su 授权入口可能被接管"; exit 1; }
            echo "自检通过：susfs 适配未重复执行 SukiSU 原生授权链路。"
          fi

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
        run: |
          set -euo pipefail
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace
          cp "${{ github.workspace }}/zram_patch/001-lz4.patch" ./common/
          cp "${{ github.workspace }}/zram_patch/lz4armv8.S" ./common/lib
          cp "${{ github.workspace }}/zram_patch/002-zstd.patch" ./common/
          cd ./common
          git apply -p1 < 001-lz4.patch
          patch -p1 < 002-zstd.patch

      - name: 应用 lz4kd 补丁
        if: inputs.lz4kd_enable
        run: |
          set -euo pipefail
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git
          cd common
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch

      - name: 添加SUSFS 配置项
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 添加 KSU & 其他配置项
        run: |
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" != "none" ]]; then
            echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "# CONFIG_KSU_DISABLE_POLICY is not set" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
              if [[ "${{ github.event.inputs.root_manager }}" == "none" ]]; then
                echo "错误：ksu_type=sukisu 需要 Manager 识别和 App Profile 授权，root_manager 不能选择 none。请改为 root_manager=default 后重新运行。"
                exit 1
              fi
              echo "# CONFIG_KSU_DISABLE_MANAGER is not set" >> ./common/arch/arm64/configs/gki_defconfig
              if [[ "${{ github.event.inputs.kpm_enable }}" == "true" ]]; then
                echo "CONFIG_KPM=y" >> ./common/arch/arm64/configs/gki_defconfig
                echo "CONFIG_KALLSYMS=y" >> ./common/arch/arm64/configs/gki_defconfig
                echo "CONFIG_KALLSYMS_ALL=y" >> ./common/arch/arm64/configs/gki_defconfig
              fi
            elif [[ "${{ github.event.inputs.root_manager }}" == "none" ]]; then
              echo "CONFIG_KSU_DISABLE_MANAGER=y" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi
          if [[ "${{ github.event.inputs.susfs_enable }}" == "false" ]]; then
            echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          #添加对 Mountify (backslashxx/mountify) 模块的支持
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == 'true' ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 开启O2编译优化配置
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          #禁用 defconfig 检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          #跳过将uapi标准头安装到 usr/include 目录的不必要操作，节省编译时间
          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          set -euo pipefail
          cd kernel_workspace
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd common
          cp "${{ github.workspace }}/other_patch/config.patch" ./config.patch
          patch -p1 -F 3 < config.patch || true

      - name: 添加 BBR 等一系列拥塞控制算法
        run: |
          if [[ "${{ github.event.inputs.bbr_enable }}" != "false" ]]; then
            echo "正在添加BBR等拥塞控制算法..."
            cd kernel_workspace
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用 Droidspaces 容器支持
        run: |
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            echo "正在启用 Droidspaces 容器支持..."
            cd kernel_workspace/common
            cp "${{ github.workspace }}/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch" ./fix_sysvipc_kabi_6_7_8.patch
            cp "${{ github.workspace }}/droidspaces_patch/fix_oplus_bsp_midas.patch" ./fix_oplus_bsp_midas.patch
            cp "${{ github.workspace }}/droidspaces_patch/ntsync_base.patch" ./ntsync_base.patch
            cp "${{ github.workspace }}/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch" ./ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
            patch -p1 -F 3 < ntsync_base.patch || true
            patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.droidspaces_enable }}" == "extend" ]]; then
              echo "正在启用容器环境扩展支持..."
              cp "${{ github.workspace }}/droidspaces_patch/evdi_drm.patch" ./evdi_drm.patch
              patch -p1 -F 3 < evdi_drm.patch || true
              echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> ./arch/arm64/configs/gki_defconfig
              echo "CONFIG_DRM_LINDROID_EVDI=y" >> ./arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用三星SSG IO调度器
        if: inputs.ssg_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_MQ_IOSCHED_SSG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_SSG_CGROUP=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用内核级基带保护
        if: inputs.baseband_guard
        run: |
          set -euo pipefail
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 添加制作名称
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FINAL_SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          else
            FINAL_SUFFIX="${{ env.KERNEL_NAME }}"
          fi
          echo "当前内核版本后缀：$FINAL_SUFFIX"
          echo "FINAL_SUFFIX=$FINAL_SUFFIX" >> $GITHUB_ENV
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${FINAL_SUFFIX}\"|" "$f"
          done

      - name: 构建内核
        run: |
          set -euo pipefail
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang20/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang20/bin"
          echo "编译器信息:"
          echo "Clang版本: $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD版本: $($CLANG_DIR/ld.lld --version | head -n 1)"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"

          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"

          cd kernel_workspace/common
          cp "${{ github.workspace }}/lib/libfakestat.so" ./libfakestat.so
          cp "${{ github.workspace }}/lib/libfaketimeMT.so" ./libfaketimeMT.so
          chmod 777 ./*.so
          export FAKESTAT="2025-09-10 13:11:53"
          export FAKETIME="@2025-09-10 13:11:53"
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          chmod +x cc-wrapper ld-wrapper

          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &

          KSU_MAKE_ARGS=()
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            KSU_MAKE_ARGS+=(
              KSU_VERSION="${SUKISU_KSU_VERSION}"
              KSU_VERSION_FULL="${SUKISU_FULL_VERSION}"
              VERSION_TAG="${SUKISU_TAG#v}"
              KSU_EXPECTED_SIZE=0x35c
              KSU_EXPECTED_HASH=947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
              KSU_MANAGER_PACKAGE=com.sukisu.ultra
            )
            echo "SukiSU 固定版本：${SUKISU_TAG}"
            echo "SukiSU 固定 KSU_VERSION：${SUKISU_KSU_VERSION}"
            echo "SukiSU 固定 Full Version：${SUKISU_FULL_VERSION}"
            echo "SukiSU Manager 包名：com.sukisu.ultra"
            echo "SukiSU Manager 签名 size：0x35c"
            echo "SukiSU Manager 签名 hash：947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef"
          fi

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error "${KSU_MAKE_ARGS[@]}" gki_defconfig

          echo "====== SukiSU / Manager / Policy / SUSFS / Droidspaces 配置自检 ======"
          grep -E '^(CONFIG_KSU|CONFIG_KPM|CONFIG_KSU_SUSFS|CONFIG_TMPFS_XATTR|CONFIG_TMPFS_POSIX_ACL|CONFIG_PID_NS|CONFIG_IPC_NS|CONFIG_SYSVIPC|CONFIG_DEVTMPFS|CONFIG_NAMESPACES|CONFIG_USER_NS|CONFIG_POSIX_MQUEUE|CONFIG_NTSYNC)=' out/.config || true
          grep -E '^# CONFIG_KSU_DISABLE_(MANAGER|POLICY) is not set' out/.config || true
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "错误：CONFIG_KSU 未启用"; exit 1; }
            ! grep -q '^CONFIG_KSU_DISABLE_MANAGER=y' out/.config || { echo "错误：sukisu 分支不能启用 CONFIG_KSU_DISABLE_MANAGER，否则 Manager 无法识别"; exit 1; }
            ! grep -q '^CONFIG_KSU_DISABLE_POLICY=y' out/.config || { echo "错误：不能启用 CONFIG_KSU_DISABLE_POLICY，否则 App Profile 授权会被关闭"; exit 1; }
            if [[ "${{ github.event.inputs.kpm_enable }}" == "true" ]]; then
              grep -q '^CONFIG_KPM=y' out/.config || { echo "错误：kpm_enable=true 但 SukiSU CONFIG_KPM 未启用"; exit 1; }
            fi
          fi
          if [[ "${{ github.event.inputs.susfs_enable }}" == "true" && "${{ github.event.inputs.ksu_type }}" != "none" ]]; then
            grep -E '^(CONFIG_KSU_SUSFS|# CONFIG_KSU_SUSFS)' out/.config || true
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "错误：susfs_enable=true 但 CONFIG_KSU_SUSFS 未启用"; exit 1; }
          fi
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            for cfg in CONFIG_PID_NS CONFIG_IPC_NS CONFIG_SYSVIPC CONFIG_DEVTMPFS CONFIG_NAMESPACES CONFIG_USER_NS CONFIG_POSIX_MQUEUE CONFIG_NTSYNC; do
              grep -q "^${cfg}=y" out/.config || { echo "错误：Droidspaces 缺少 ${cfg}=y"; exit 1; }
            done
          fi

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error "${KSU_MAKE_ARGS[@]}" Image
          test -f out/arch/arm64/boot/Image
          echo "内核编译完成。"
          ccache -s
          df -h

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 应用KPM并修补内核
        if: inputs.kpm_enable
        run: |
          set -euo pipefail
          echo "正在应用KP-N并修补内核..."
          cd kernel_workspace/common/out/arch/arm64/boot
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          chmod +x ./kptools-linux
          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          rm -f Image
          mv oImage Image

      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          test -f ./Image

          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi
          KSUVER="${KSUVER:-none}"
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == 'true' ]]; then
            cp "${{ github.workspace }}/zram.zip" ./zram.zip
          fi
          if [[ "${{ github.event.inputs.kpm_enable }}" == 'true' ]]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FINAL_SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          else
            FINAL_SUFFIX="${{ env.KERNEL_NAME }}"
          fi

          FEATURE_TAGS=""
          [[ "${{ github.event.inputs.root_manager }}" == "none" ]] && FEATURE_TAGS="${FEATURE_TAGS}_mgrnone"
          [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]] && FEATURE_TAGS="${FEATURE_TAGS}_dss"
          [[ "${{ github.event.inputs.kpm_enable }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_kpm"
          [[ "${{ github.event.inputs.lz4_enable }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_lz4"
          [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_lz4kd"
          [[ "${{ github.event.inputs.better_net }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_net"
          [[ "${{ github.event.inputs.rekernel_enable }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_rek"
          [[ "${{ github.event.inputs.baseband_guard }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_bbg"

          AK3_NAME="AnyKernel3_${{ env.DEVICE_MODEL }}_${KSU_TYPENAME}_${KSUVER}_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}_${FINAL_SUFFIX}${FEATURE_TAGS}.zip"
          FULL_VERSION="${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${FINAL_SUFFIX}"
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT
          echo "ak3dir=kernel_workspace/AnyKernel3" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          cat > ./ak3.log <<EOF
          Author: $GITHUB_ACTOR
          Repo: $GITHUB_REPOSITORY
          Branch: $GITHUB_REF_NAME
          Run ID: $GITHUB_RUN_ID
          Commit: $GITHUB_SHA
          Time: $TIME_NOW
          Device: ${{ env.DEVICE_NAME }} / ${{ env.DEVICE_MODEL }} / ${{ env.DEVICE_BOARD }}
          Source: ${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_REF }}
          Source Commit: ${SOURCE_COMMIT:-unknown}
          Kernel Ver: $FULL_VERSION
          KSU Branch: ${KSU_TYPENAME}
          KSU Ver: ${KSUVER}
          Root Manager Input: ${{ github.event.inputs.root_manager }}
          susfs: ${{ github.event.inputs.susfs_enable }}
          KPM: ${{ github.event.inputs.kpm_enable }}
          LZ4: ${{ github.event.inputs.lz4_enable }}
          LZ4KD: ${{ github.event.inputs.lz4kd_enable }}
          IPset: ${{ github.event.inputs.better_net }}
          BBR&Brutal: ${{ github.event.inputs.bbr_enable }}
          Droidspaces: ${{ github.event.inputs.droidspaces_enable }}
          SSG: ${{ github.event.inputs.ssg_enable }}
          Re-Kernel: ${{ github.event.inputs.rekernel_enable }}
          BBG: ${{ github.event.inputs.baseband_guard }}
          EOF
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            cat >> ./ak3.log <<'EOF'
          SukiSU Fixed Tag: v4.1.3
          SukiSU Manager Package: com.sukisu.ultra
          SukiSU Manager Signature Size: 0x35c
          SukiSU Manager Signature Hash: 947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
          SukiSU Manager Recognition: forced enabled for sukisu
          SukiSU Policy/App Profile: forced enabled for sukisu
          SukiSU Notice: use official SukiSU Ultra v4.1.3 Manager for first App root authorization
          EOF
          fi
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 上传 Ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-log-rmx5062
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
          if-no-files-found: warn

      - name: 上传 AnyKernel3 一层工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: |
            ${{ github.workspace }}/${{ steps.create_zip.outputs.ak3dir }}/*
            !${{ github.workspace }}/${{ steps.create_zip.outputs.ak3dir }}/.git/**
          if-no-files-found: error

      - name: 上传 Release 专用 ZIP 工件
        if: inputs.release_enable
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.create_zip.outputs.ak3name }}
          path: ${{ github.workspace }}/kernel_workspace/${{ steps.create_zip.outputs.ak3name }}
          if-no-files-found: error

  release:
    if: inputs.release_enable
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.ak3name }}
          path: ./release_zips

      - name: 设置环境变量
        run: |
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          echo "TAG_HEAD=RMX5062-build" >> $GITHUB_ENV
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            KSU_TYPENAME="KernelSU (Official)"
          else
            KSU_TYPENAME="无内置KSU"
          fi
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV

      - name: 创建发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << EOF > release_notes.md
          ### 📱 ${{ env.DEVICE_NAME }} / ${{ env.DEVICE_MODEL }} 官方 OKI 内核 | 构建信息
          - 内核版本号: ${{ needs.build.outputs.full_version }}
          - 编译时间: ${{ env.TIME_FORM }}
          - 机型：${{ env.DEVICE_NAME }} / ${{ env.DEVICE_MODEL }} / ${{ env.DEVICE_BOARD }}
          - 官方源码：${{ env.SOURCE_REPO }}
          - 源码分支：${{ env.SOURCE_REF }}
          - 源码提交：${{ needs.build.outputs.source_commit }}
          - KSU分支：${{ env.KSU_TYPENAME }}
          - KSU版本：${{ needs.build.outputs.ksuver }}
          - Root管理器集成：${{ github.event.inputs.root_manager }}
          - SukiSU固定版本：ksu_type=sukisu 时固定 SukiSU Ultra v4.1.3 / KSUVER 20296
          - SukiSU Manager识别：ksu_type=sukisu 时固定包名 com.sukisu.ultra，签名 0x35c / 947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
          - SukiSU授权策略：ksu_type=sukisu 时强制保留 Manager 识别和 App Profile，不启用 CONFIG_KSU_DISABLE_MANAGER / CONFIG_KSU_DISABLE_POLICY
          - susfs支持：${{ github.event.inputs.susfs_enable }}
          - KPM支持：${{ github.event.inputs.kpm_enable }}
          - LZ4支持：${{ github.event.inputs.lz4_enable }}
          - LZ4KD支持：${{ github.event.inputs.lz4kd_enable }}
          - 网络功能增强：${{ github.event.inputs.better_net }}
          - BBR/Brutal 等拥塞控制算法支持：${{ github.event.inputs.bbr_enable }}
          - Droidspaces 容器支持：${{ github.event.inputs.droidspaces_enable }}
          - 三星SSG IO调度器支持：${{ github.event.inputs.ssg_enable }}
          - Re-Kernel支持：${{ github.event.inputs.rekernel_enable }}
          - 内核级基带保护支持：${{ github.event.inputs.baseband_guard }}

          ### 📋 安装方法
          1. 本产物是 AnyKernel3 可刷 zip，不是完整 boot.img。
          2. 刷入前请确认设备为 realme Neo7 Turbo / RMX5062，当前系统为 Android 15 且内核线为 6.1.115 / android14-6.1。
          3. 刷入前务必备份当前槽位 boot，建议同时保留 stock init_boot/vendor_boot/dtbo/vbmeta 等镜像。
          4. 有 root 时可使用 KernelFlasher/HorizonKernelFlasher 刷入 AnyKernel3 包；有第三方 Recovery 时也可在 Recovery 中刷入。
          5. ksu_type=sukisu 时请使用官方 SukiSU Ultra v4.1.3 Manager 首次验证 App root 授权，不要使用 ReSukiSU Manager 或重签 APK 验证 SukiSU 首次授权。
          6. 若启用 Droidspaces，建议先使用 standard，不建议第一次直接刷 extend。
          7. 如出现 bootloop，请进 fastboot 刷回备份或线刷包中的 stock boot.img。

          #### ※※※刷写内核有风险，确认备份和救砖路径后再操作。※※※
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.DEVICE_MODEL }} ${{ needs.build.outputs.full_version }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip

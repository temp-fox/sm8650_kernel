name: newrealme Neo7 Turbo 6.1.115

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  SUB_VERSION: '115'
  DEVICE_MODEL: 'RMX5062'
  DEVICE_NAME: 'realme Neo7 Turbo'
  DEVICE_BOARD: 'RE602EL1'
  KERNEL_NAME: 'android14-11-o-gbc8558aaf2a5'
  SOURCE_REPO: 'realme-kernel-opensource/realme_neo7_turbo-AndroidV-kernel-source'
  SOURCE_REF: 'master'
  SOURCE_DIR: 'realme_neo7_turbo-AndroidV-kernel-source-master'
  CCACHE_KEY: ccache-rmx5062-android14-6.1.115
  RMX5062_KBUILD_BUILD_USER: 'builder'
  RMX5062_KBUILD_BUILD_HOST: 'localhost'
  RMX5062_KBUILD_BUILD_TIMESTAMP: '2025-09-10 13:11:53'
  RMX5062_KBUILD_BUILD_VERSION: '1'

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支(ReSukiSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认SukiSU Ultra)'
        required: true
        type: choice
        default: 'sukisu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      root_manager:
        description: 'Root管理器集成(default-启用Manager识别和App授权; none-禁用Manager识别/签名逻辑，SukiSU授权App root请勿选择)'
        required: true
        type: choice
        default: 'default'
        options:
          - 'default'
          - 'none'
      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: '是否开启kpm(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: true
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: true
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: '是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default设为默认)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'standard'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: true
      ssg_enable:
        description: '是否启用三星SSG IO调度器支持(提升IO读写性能; 在一加12上可能导致bug)'
        required: true
        type: boolean
        default: true
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: true
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: true
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: true
      release_enable:
        description: '是否创建 GitHub Release(默认关闭，只上传 artifact)'
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
      full_version: ${{ steps.create_zip.outputs.full_version }}
      source_commit: ${{ steps.init.outputs.source_commit }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出当前构建脚本仓库
        uses: actions/checkout@v4

      - name: 安装环境依赖并初始化 RMX5062 官方源码和 llvm-Clang20 工具链
        id: init
        run: |
          set -euo pipefail
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          echo "目标设备：${{ env.DEVICE_NAME }} / ${{ env.DEVICE_MODEL }} / ${{ env.DEVICE_BOARD }}"
          echo "官方源码：${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_REF }}"

          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt update
          sudo apt-get install -y --no-install-recommends aria2 binutils python-is-python3 libssl-dev libelf-dev unzip zip ccache zstd pahole dwarves

          echo "正在安装 ccache-ECS..."
          cp "${{ github.workspace }}/lib/ccache-x86-64" ccache
          sudo cp -f ./ccache /usr/bin/ccache
          sudo chmod +x /usr/bin/ccache
          rm -f ./ccache

          echo "正在获取 RMX5062 官方源码提交..."
          SOURCE_COMMIT="$(git ls-remote "https://github.com/${{ env.SOURCE_REPO }}.git" "refs/heads/${{ env.SOURCE_REF }}" | awk '{print $1}')"
          if [[ -z "$SOURCE_COMMIT" ]]; then
            echo "无法获取官方源码提交，请检查 SOURCE_REPO/SOURCE_REF"
            exit 1
          fi
          echo "官方源码提交：$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

          echo "正在下载 RMX5062 官方源码..."
          aria2c -s16 -x16 -k1M "https://github.com/${{ env.SOURCE_REPO }}/archive/refs/heads/${{ env.SOURCE_REF }}.zip" -o common.zip
          unzip -q common.zip
          mv "${{ env.SOURCE_DIR }}" common
          rm -f common.zip

          echo "官方源码 build.config.constants："
          cat common/build.config.constants || true
          echo "官方源码 Makefile 版本："
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' common/Makefile || true

          echo "正在补齐 RMX5062 官方源码缺失的 Oplus Kconfig 占位..."
          prepare_oplus_placeholder() {
            local in_tree="$1"
            local vendor_target="$2"
            local name="$3"
            echo "处理 $name: $in_tree -> $vendor_target"
            mkdir -p "$vendor_target"
            : > "$vendor_target/Kconfig"
            : > "$vendor_target/Makefile"
            if [[ -L "$in_tree" ]]; then
              echo "检测到 $in_tree 是 symlink，目标为：$(readlink "$in_tree")"
              echo "已补齐 symlink 目标占位：$vendor_target"
            else
              if [[ -e "$in_tree" && ! -d "$in_tree" ]]; then
                echo "检测到 $in_tree 是普通文件占位，内容如下："
                cat "$in_tree" || true
                rm -f "$in_tree"
              fi
              mkdir -p "$in_tree"
              : > "$in_tree/Kconfig"
              : > "$in_tree/Makefile"
            fi
          }
          # drivers/soc/oplus/* 的源码占位目标形如 ../../../../vendor/...，从 common/drivers/soc/oplus 解析后位于 kernel_workspace/vendor/...。
          prepare_oplus_placeholder "common/drivers/soc/oplus/oplus_resctrl" "vendor/oplus/kernel/oplus_performance/oplus_resctrl" "oplus_resctrl"
          prepare_oplus_placeholder "common/drivers/soc/oplus/storage" "vendor/oplus/kernel/storage" "oplus_storage"
          # Kconfig.ext 会硬 source kernel/oplus_cpu/Kconfig；kernel/oplus_cpu 指向 ../../vendor/oplus/kernel/cpu。
          prepare_oplus_placeholder "common/kernel/oplus_cpu" "vendor/oplus/kernel/cpu" "oplus_cpu"

          echo "正在补齐 RMX5062 官方源码缺失的 Oplus locking 空实现..."
          # kernel/locking/locking_main.h 与 oplus_locking.c 指向 ../../../vendor/oplus/kernel/synchronize/。
          # 主线 locking/sched 代码会硬引用这些 Oplus hook；baseline 构建中用 no-op 实现保持原流程继续编译。
          mkdir -p vendor/oplus/kernel/synchronize
          cat > vendor/oplus/kernel/synchronize/oplus_locking.h <<'EOF'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _OPLUS_LOCKING_H
          #define _OPLUS_LOCKING_H

          struct task_struct;

          static inline void locking_record_switch_in_cs(struct task_struct *task) { }

          #endif
          EOF
          cat > vendor/oplus/kernel/synchronize/oplus_locking.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/export.h>
          #include <linux/types.h>

          #include "oplus_locking.h"

          struct mutex;
          struct percpu_rw_semaphore;
          struct rt_mutex_base;
          struct rw_semaphore;
          struct task_struct;

          void android_vh_pcpu_rwsem_handler(u64 sem, struct task_struct *tsk,
                                             unsigned long jiffies) { }
          EXPORT_SYMBOL_GPL(android_vh_pcpu_rwsem_handler);

          void mutex_lock_handler(u64 lock, struct task_struct *tsk, unsigned long jiffies) { }
          EXPORT_SYMBOL_GPL(mutex_lock_handler);

          void rwsem_lock_handler(u64 sem, struct task_struct *tsk, unsigned long jiffies) { }
          EXPORT_SYMBOL_GPL(rwsem_lock_handler);

          void mutex_wait_handler(struct mutex *lock) { }
          EXPORT_SYMBOL_GPL(mutex_wait_handler);

          void rwsem_read_wait_handler(struct rw_semaphore *sem) { }
          EXPORT_SYMBOL_GPL(rwsem_read_wait_handler);

          void pcp_wait_handler(struct percpu_rw_semaphore *sem, bool is_reader, int phase) { }
          EXPORT_SYMBOL_GPL(pcp_wait_handler);

          void rtmutex_lock_handler(u64 lock, struct task_struct *tsk,
                                    unsigned long jiffies) { }
          EXPORT_SYMBOL_GPL(rtmutex_lock_handler);

          void rtmutex_wait_handler(struct rt_mutex_base *lock) { }
          EXPORT_SYMBOL_GPL(rtmutex_wait_handler);
          EOF
          if [[ ! -L common/kernel/locking/locking_main.h ]]; then
            cp vendor/oplus/kernel/synchronize/oplus_locking.h common/kernel/locking/locking_main.h
          fi
          cp vendor/oplus/kernel/synchronize/oplus_locking.h common/kernel/locking/oplus_locking.h
          if [[ ! -L common/kernel/locking/oplus_locking.c ]]; then
            cp vendor/oplus/kernel/synchronize/oplus_locking.c common/kernel/locking/oplus_locking.c
          fi

          echo "正在补齐 RMX5062 官方源码缺失的 Oplus mm trace 空实现..."
          # mm/mm-trace.h 指向 ../../vendor/oplus/kernel/mm/mm_osvelte/mm-trace.h；vmscan.c 只需要这些 trace 接口存在。
          mkdir -p vendor/oplus/kernel/mm/mm_osvelte
          cat > vendor/oplus/kernel/mm/mm_osvelte/mm-trace.h <<'EOF'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _OPLUS_MM_TRACE_H
          #define _OPLUS_MM_TRACE_H

          #define mm_trace_int64(name, value) do { } while (0)
          #define mm_trace_fmt_begin(fmt, ...) do { } while (0)
          #define mm_trace_fmt_end() do { } while (0)

          #endif
          EOF
          if [[ ! -L common/mm/mm-trace.h ]]; then
            cp vendor/oplus/kernel/mm/mm_osvelte/mm-trace.h common/mm/mm-trace.h
          fi

          echo "正在下载 llvm-Clang20 工具链..."
          mkdir -p clang20
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/clang-r547379.zip -o clang.zip
          unzip -q clang.zip -d clang20
          rm -f clang.zip

          echo "正在下载构建工具..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip
          rm -f build-tools.zip

          echo "源码与工具链初始化完成。"
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_rmx5062_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入 RMX5062 ccache 缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 初始化并配置ccache
        run: |
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          ccache -s

      - name: 添加KernelSU
        id: ksu_version
        run: |
          set -euo pipefail
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            SUKISU_TAG="v4.1.3"
            echo "正在配置 SukiSU Ultra ${SUKISU_TAG}..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/tags/${SUKISU_TAG}/kernel/setup.sh" | bash -s "${SUKISU_TAG}"
            cd ./KernelSU
            git fetch --tags --force
            git checkout -f "${SUKISU_TAG}"
            test "$(git describe --tags --exact-match HEAD)" = "${SUKISU_TAG}"
            SUKISU_COMMIT="$(git rev-parse --short=8 HEAD)"
            # KSU_VERSION 必须与 Manager 的 versionCode 完全一致，否则 Manager 会报
            # “管理器版本 X 和 kernelsu 驱动版本 Y 不匹配”。
            #
            # 两侧用的是同一个公式，这是官方的设计约定：
            #   内核    kernel/Kbuild:        VERSION_BASE(40000) + commitCount - VERSION_OFFSET(2815)
            #   Manager manager/build.gradle.kts: major(4) * 10000 + commitCount - end(2815)
            #
            # 所以这里不能硬写常数，必须从 tag 所指提交的 commit 数按同一公式推导，
            # 换 tag 时才会自动跟随。v4.1.3 的 commit 数是 3611，算出 40796，
            # 与官方 release 资产名 SukiSU_v4.1.3_40796-release.apk 一致。
            #
            # 用 rev-list --count HEAD 而不是 --count main：setup.sh 拉下来的仓库不一定
            # 有本地 main 分支，且我们已 checkout 到 tag，HEAD 就是 tag 所指提交，
            # 计数结果与官方在 main 上的计数相同（tag 在 main 的历史上）。
            SUKISU_VERSION_BASE="$(grep -oP '^VERSION_BASE\s*:=\s*\K[0-9]+' kernel/Kbuild)"
            SUKISU_VERSION_OFFSET="$(grep -oP '^VERSION_OFFSET\s*:=\s*\K[0-9]+' kernel/Kbuild)"
            # 浅克隆会让 rev-list --count 只数到很小的值，算出来的版本号照样能通过
            # 后面的 -ge 40000 断言之外的部分，却与 Manager 对不上。这里先补全历史。
            # setup.sh 当前用的是不带 --depth 的 git clone，正常情况下不会浅克隆，
            # 但上游改脚本的成本很低，不值得把正确性押在它身上。
            if [ -f .git/shallow ]; then
              echo "检测到浅克隆，正在补全完整历史以保证 commit 计数准确..."
              git fetch --unshallow
            fi
            SUKISU_COMMIT_COUNT="$(git rev-list --count HEAD)"
            KSU_VERSION="$(( SUKISU_VERSION_BASE + SUKISU_COMMIT_COUNT - SUKISU_VERSION_OFFSET ))"
            echo "SukiSU 版本推导：${SUKISU_VERSION_BASE} + ${SUKISU_COMMIT_COUNT} - ${SUKISU_VERSION_OFFSET} = ${KSU_VERSION}"
            # 兜底断言：公式取自 Kbuild 本身，取不到值会算出异常数，这里挡住
            test "${SUKISU_VERSION_BASE}" = "40000" || { echo "错误：VERSION_BASE 解析异常（${SUKISU_VERSION_BASE}）"; exit 1; }
            test "${SUKISU_VERSION_OFFSET}" = "2815" || { echo "错误：VERSION_OFFSET 解析异常（${SUKISU_VERSION_OFFSET}）"; exit 1; }
            test "${KSU_VERSION}" -ge 40000 || { echo "错误：推导出的 KSU_VERSION 异常偏小（${KSU_VERSION}），会导致 Manager 报版本不匹配"; exit 1; }
            # v4.1.3 是写死的 tag，正确答案唯一，直接钉死：
            # 官方 release 资产名就叫 SukiSU_v4.1.3_40796-release.apk，
            # Manager 的 versionCode 也是 40796。对不上就是推导链出了问题，
            # 与其让用户刷完机再看到“版本不匹配”，不如在这里失败。
            if [ "${SUKISU_TAG}" = "v4.1.3" ] && [ "${KSU_VERSION}" != "40796" ]; then
              echo "错误：v4.1.3 的 KSU_VERSION 应为 40796（官方 APK: SukiSU_v4.1.3_40796-release.apk），实际推导出 ${KSU_VERSION}"
              echo "      commit 计数 = ${SUKISU_COMMIT_COUNT}（v4.1.3 应为 3611）"
              exit 1
            fi
            SUKISU_FULL_VERSION="${SUKISU_TAG}-${SUKISU_COMMIT}@${SUKISU_TAG}"
            sed -i "s|^REPO_BRANCH := .*|REPO_BRANCH := ${SUKISU_TAG}|" kernel/Kbuild
            sed -i "s|^KSU_GITHUB_VER   := .*|KSU_GITHUB_VER   := ${SUKISU_TAG#v}|" kernel/Kbuild
            sed -i 's|^GITHUB_COMMITS   := .*|GITHUB_COMMITS   := |' kernel/Kbuild
            sed -i "s|^KSU_VERSION     := .*|KSU_VERSION     := ${KSU_VERSION}|" kernel/Kbuild
            sed -i "s|^VERSION_TAG     := .*|VERSION_TAG     := ${SUKISU_TAG#v}|" kernel/Kbuild
            sed -i "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := ${SUKISU_FULL_VERSION}|" kernel/Kbuild
            grep -q "^KSU_VERSION     := ${KSU_VERSION}$" kernel/Kbuild
            grep -q "^VERSION_TAG     := ${SUKISU_TAG#v}$" kernel/Kbuild
            grep -q "^KSU_VERSION_FULL := ${SUKISU_FULL_VERSION}$" kernel/Kbuild
            echo "SukiSU Ultra 固定版本：${SUKISU_TAG}"
            echo "SukiSU Ultra 固定提交：${SUKISU_COMMIT}"
            echo "SukiSU Ultra 固定 Full Version：${SUKISU_FULL_VERSION}"
            echo "SukiSU Ultra 固定 KSUVER：${KSU_VERSION}"
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "SUKISU_TAG=$SUKISU_TAG" >> $GITHUB_ENV
            echo "SUKISU_KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
            echo "SUKISU_FULL_VERSION=$SUKISU_FULL_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.ksu_type }}" == "resukisu" ]]; then
            echo "正在配置 ReSukiSU..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@rmx5062"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksunext" ]]; then
            echo "正在配置KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            cd ../common/drivers/kernelsu
            cp "${{ github.workspace }}/other_patch/apk_sign.patch" ./apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置。"
            echo "KSUVER=none" >> $GITHUB_ENV
            echo "ksuver=none" >> $GITHUB_OUTPUT
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          set -euo pipefail
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" != "none" ]]; then
            echo "正在添加susfs补丁..."
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            cp "${{ github.workspace }}/other_patch/69_hide_stuff.patch" ./common/69_hide_stuff.patch
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            cd ./common
            patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true
            cd ..
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置。"
          fi
          if [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            cd ./KernelSU
            patch -p1 < 10_enable_susfs_for_ksu.patch
          elif [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            echo "正在为 SukiSU v4.1.3 应用 SUSFS 真实接口适配..."
            echo "保留 susfs4oki 的 OKI GKI 补丁；不再叠加 syscall_hooks.patch，避免 fs/open.c 等双重 hook 类型冲突。"
            # 适配脚本放在独立文件里，不内嵌 heredoc：GitHub 会把整个 run 块当一个表达式
            # 计算，上限 21000 字符，内嵌 500 多行 Python 会直接超限导致 workflow 无法解析。
            python3 "${{ github.workspace }}/.github/scripts/sukisu_susfs_adapt_new.py"
            echo "====== SUSFS 设置页卡死修复自检 ======"
            # 开启 SUSFS 后，同一次 syscall(SYS_reboot) 上原本有两条路径并存：
            # v4.1.3 自带的 kprobe（认 KSU_INSTALL_MAGIC2），以及 susfs 补丁插在
            # SYSCALL_DEFINE4(reboot) 函数体里的 ksu_handle_sys_reboot() 调用。
            # 后者原先只认 SUSFS_MAGIC，管理器请求装 fd 时会落到 return 1 →
            # goto orig_flow → 掉进真正的 sys_reboot → 被 CAP_SYS_BOOT 拒掉返回
            # -EPERM。fd 其实已由 kprobe 装好，但返回值是失败，管理器判定授权失败。
            # 管理器 SUSFS 页面会对每个已安装 app 并发起 root shell，全部命中这条
            # 失败路径，页面就卡死了。修法对齐 builtin 分支：开 SUSFS 时停用 kprobe，
            # 由 ksu_handle_sys_reboot 独占，并补上 KSU_INSTALL_MAGIC2 分支。
            grep -qF 'if (magic2 == KSU_INSTALL_MAGIC2)' KernelSU/kernel/supercall/supercall.c || {
              echo "错误：supercall.c 缺少 KSU_INSTALL_MAGIC2 分支，管理器装 fd 会失败，SUSFS 页面必然卡死"; exit 1; }
            grep -qF 'ksu_supercall_reboot_handler_susfs' KernelSU/kernel/supercall/supercall.c || {
              echo "错误：supercall.c 未注入 fd 安装处理函数"; exit 1; }
            # kprobe 必须落在 #else 分支里，即开 SUSFS 时不注册，否则两条路径并存
            grep -qF '#ifdef CONFIG_KSU_SUSFS' KernelSU/kernel/supercall/supercall.c || {
              echo "错误：supercall.c 的 kprobe 注册未做 SUSFS 条件编译"; exit 1; }
            # reboot_kp 在开 SUSFS 时两处引用都被编译掉，必须有 __maybe_unused，
            # 否则 -Wunused-variable 叠加 -Werror 直接编译失败
            grep -qF 'static struct kprobe __maybe_unused reboot_kp' KernelSU/kernel/supercall/supercall.c || {
              echo "错误：reboot_kp 缺 __maybe_unused，开 SUSFS 时会因未使用变量编译失败"; exit 1; }
            grep -qF 'ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);' <(sed -n '/sukisu_handle_setresuid_susfs/,$p' KernelSU/kernel/hook/setuid_hook.c) || {
              echo "错误：setuid_hook.c 的 SUSFS 适配块未给 Manager/授权 app 放行 reboot(142)，libksud 会被 seccomp SIGSYS 杀掉"; exit 1; }
            grep -qF 'ksu_set_task_tracepoint_flag(current);' <(sed -n '/sukisu_handle_setresuid_susfs/,$p' KernelSU/kernel/hook/setuid_hook.c) || {
              echo "错误：setuid_hook.c 的 SUSFS 适配块未恢复 SukiSU tracepoint flag，授权 app 的 supercall 通道不完整"; exit 1; }
            echo "自检通过：reboot 通道单一路径，Manager/授权 app 的 seccomp 放行已就位。"
            echo "====== SukiSU SUSFS 适配自检：确认两套 ABI 未互相接管 ======"
            # v4.1.3 的 ksu_handle_faccessat / ksu_handle_stat 是 const char __user ** ABI，
            # 由 tracepoint 在 syscall 层调用，是 SukiSU 原生 su 授权入口；susfs 在 VFS 层用的是
            # struct filename ** ABI。两者同名会 conflicting types 编译失败，改名接管会破坏授权。
            # 因此 susfs 侧必须走 sukisu_susfs_handle_* 独立桥接。

            # 1. SukiSU 原生的两个 sucompat 入口必须保持原签名，不得被 susfs 的 ABI 覆盖
            grep -q 'int ksu_handle_faccessat(int \*dfd, const char __user \*\*filename_user, int \*mode, int \*__unused_flags)' KernelSU/kernel/feature/sucompat.c || {
              echo "错误：sucompat.c 中 SukiSU 原生 ksu_handle_faccessat 的签名被改动"; exit 1; }
            grep -q 'int ksu_handle_stat(int \*dfd, const char __user \*\*filename_user, int \*flags)' KernelSU/kernel/feature/sucompat.c || {
              echo "错误：sucompat.c 中 SukiSU 原生 ksu_handle_stat 的签名被改动"; exit 1; }

            # 2. 不得存在 struct filename ** 版本的同名定义（上一版正是这样编译失败的）
            ! grep -qE '^(int|long) ksu_handle_(faccessat|stat|execveat)\(int \*[a-z]+, struct filename \*\*' KernelSU/kernel/feature/sucompat.c || {
              echo "错误：sucompat.c 出现 struct filename ** 版本的同名定义，会与原生 ABI 冲突"; exit 1; }

            # 3. susfs 的三处 VFS 调用点必须全部改指到独立桥接函数
            grep -q 'sukisu_susfs_handle_execveat(&fd, &filename, &argv, &envp, &flags);' common/fs/exec.c || {
              echo "错误：common/fs/exec.c 未改指到 susfs 独立桥接函数"; exit 1; }
            grep -q 'sukisu_susfs_handle_faccessat(&dfd, &fname, &mode, NULL);' common/fs/open.c || {
              echo "错误：common/fs/open.c 未改指到 susfs 独立桥接函数"; exit 1; }
            grep -q 'sukisu_susfs_handle_stat(&dfd, &filename, &flags);' common/fs/stat.c || {
              echo "错误：common/fs/stat.c 未改指到 susfs 独立桥接函数"; exit 1; }

            # 4. common/fs 下不得再残留对 SukiSU 原生符号的 VFS 层调用，
            #    也不得残留收掉分支后本应清除的孤儿 extern
            ! grep -qE 'ksu_handle_(execveat|execveat_sucompat|faccessat|stat)\(&' common/fs/exec.c common/fs/open.c common/fs/stat.c || {
              echo "错误：common/fs 仍在 VFS 层调用 SukiSU 原生 su 授权入口"; exit 1; }
            ! grep -q 'susfs_is_sdcard_android_data_not_decrypted' common/fs/exec.c || {
              echo "错误：common/fs/exec.c 残留未使用的 susfs sdcard static key 声明"; exit 1; }

            # 5. susfs 桥接只做 su -> sh 改写，不得重复 SukiSU 的 ksud 注入与 root profile 逃逸
            ! grep -qE 'escape_with_root_profile|ksu_handle_execveat_ksud' <(sed -n '/sukisu_susfs_vfs_bridge/,$p' KernelSU/kernel/feature/sucompat.c) || {
              echo "错误：susfs 桥接块重复执行了 SukiSU 原生 su 拦截逻辑"; exit 1; }

            # 6. setresuid 与 init.rc 注入仍由 SukiSU 原生独占，susfs 侧不得重复调用
            ! grep -q 'ksu_handle_setresuid(' <(sed -n '/sukisu_handle_setresuid_susfs/,$p' KernelSU/kernel/hook/setuid_hook.c) || {
              echo "错误：setuid_hook.c 的 susfs 适配块重复调用了 SukiSU 原生 setresuid 处理函数"; exit 1; }
            ! grep -q 'ksu_handle_sys_read_sukisu' <(sed -n '/sukisu_susfs_init_rc_stubs/,$p' KernelSU/kernel/runtime/ksud_integration.c) || {
              echo "错误：ksud_integration.c 的 susfs 适配块重复执行了 SukiSU 原生 init.rc 注入"; exit 1; }

            # 7. susfs 的 security/selinux/{avc,hooks,selinuxfs}.c 补丁会 extern 引用这 8 个符号。
            #    上一轮 CI 就是在链接阶段缺这 8 个而失败（undefined symbol）。
            #    selinux_hide.c 里那 6 个必须已去掉 static，且不得残留 static 版本。
            #    注意这里一律用 grep -F 固定串匹配：正则里的 * 经 YAML + shell 双引号
            #    两层剥离后会退化成量词，曾经导致断言假失败。
            grep -qF 'bool ksu_selinux_hide_enabled __read_mostly = false;' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：selinux_hide.c 的 ksu_selinux_hide_enabled 未导出为全局符号，链接会缺符号"; exit 1; }
            grep -qF 'bool ksu_selinux_hide_running __read_mostly = false;' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：selinux_hide.c 的 ksu_selinux_hide_running 未导出为全局符号，链接会缺符号"; exit 1; }
            grep -qF 'struct page *fake_status = NULL;' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：selinux_hide.c 的 fake_status 未导出为全局符号"; exit 1; }
            grep -qF 'struct selinux_state fake_state;' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：selinux_hide.c 的 fake_state 未导出为全局符号"; exit 1; }
            grep -qF 'DEFINE_STATIC_KEY_FALSE(fake_status_initialize_key);' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：selinux_hide.c 的 fake_status_initialize_key 未导出为全局符号"; exit 1; }
            grep -qF 'void initialize_fake_status()' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：selinux_hide.c 的 initialize_fake_status 未导出为全局函数"; exit 1; }
            #    反向断言：残留任何一个 static 版本都说明去 static 替换没生效
            for pat in 'static bool ksu_selinux_hide_enabled' 'static bool ksu_selinux_hide_running' \
                       'static struct selinux_state fake_state;' 'static struct page *fake_status' \
                       'static DEFINE_STATIC_KEY_FALSE(fake_status_initialize_key)' \
                       'static void initialize_fake_status()'; do
              ! grep -qF "$pat" KernelSU/kernel/feature/selinux_hide.c || {
                echo "错误：selinux_hide.c 仍残留 static 定义（$pat），去 static 替换未生效"; exit 1; }
            done

            #    另外两个 sid 是 SukiSU 里本来不存在的，必须真实定义并在策略加载后解析。
            grep -qF 'u32 susfs_ksu_sid __read_mostly = 0;' KernelSU/kernel/selinux/selinux.c || {
              echo "错误：selinux.c 未定义 susfs_ksu_sid"; exit 1; }
            grep -qF 'u32 susfs_priv_app_sid __read_mostly = 0;' KernelSU/kernel/selinux/selinux.c || {
              echo "错误：selinux.c 未定义 susfs_priv_app_sid"; exit 1; }
            grep -qF 'susfs_set_batch_sid();' KernelSU/kernel/selinux/rules.c || {
              echo "错误：rules.c 未在策略加载后调用 susfs_set_batch_sid()"; exit 1; }
            grep -qF 'extern u32 susfs_ksu_sid;' KernelSU/kernel/selinux/selinux.h || {
              echo "错误：selinux.h 未声明 susfs_ksu_sid"; exit 1; }

            # 8. SukiSU 原生 selinux_hide 的 context/access/status 与本 flow 新补的
            #    /sys/fs/selinux/policy 必须使用同一个普通 App 隐藏视图，避免出现
            #    status 已 fake、policy 仍 live 的矛盾结果。
            grep -qF 'extern struct selinux_policy *backup_sepolicy;' common/security/selinux/selinuxfs.c || {
              echo "错误：selinuxfs.c 未声明 backup_sepolicy，无法向普通 App 返回原始 SELinux policy"; exit 1; }
            grep -qF 'static bool susfs_selinux_hide_for_current_app(void)' common/security/selinux/selinuxfs.c || {
              echo "错误：selinuxfs.c 未注入普通 App SELinux 隐藏统一门控"; exit 1; }
            grep -qF 'current_uid().val >= 10000 && backup_sepolicy && ksu_selinux_hide_running' common/security/selinux/selinuxfs.c || {
              echo "错误：SELinux 隐藏门控未限制为普通 App + backup_sepolicy + running 状态"; exit 1; }
            grep -qF 'static void susfs_fix_fake_status_page(void)' common/security/selinux/selinuxfs.c || {
              echo "错误：selinuxfs.c 未注入 fake status 修正函数"; exit 1; }
            grep -qF 'status->policyload = 1;' common/security/selinux/selinuxfs.c || {
              echo "错误：fake status 未修正 policyload=0 指纹"; exit 1; }
            grep -qF 'status->sequence = 2;' common/security/selinux/selinuxfs.c || {
              echo "错误：fake status 未修正 sequence=0 指纹"; exit 1; }
            grep -qF 'susfs_fix_fake_status_page();' common/security/selinux/selinuxfs.c || {
              echo "错误：status open 路径未刷新 fake status"; exit 1; }
            grep -qF 'static int susfs_read_backup_policy(void **data, size_t *len)' common/security/selinux/selinuxfs.c || {
              echo "错误：selinuxfs.c 未注入 backup_sepolicy 导出函数"; exit 1; }
            if [[ "$(grep -cF 'if (likely(susfs_selinux_hide_for_current_app()))' common/security/selinux/selinuxfs.c)" -lt 2 ]]; then
              echo "错误：/sys/fs/selinux/policy 和 status 未同时使用统一隐藏门控"; exit 1;
            fi
            grep -qF 'rc = susfs_read_backup_policy(&plm->data, &plm->len);' common/security/selinux/selinuxfs.c || {
              echo "错误：/sys/fs/selinux/policy 未切换到 backup_sepolicy 快照"; exit 1; }
            grep -qF 'ksu_selinux_hide_enabled = false;' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：selinux_hide 启用失败时未回滚 enabled 状态"; exit 1; }
            grep -qF 'new_status->policyload = 1;' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：SukiSU fake status 未修正 policyload=0 指纹"; exit 1; }
            grep -qF 'new_status->sequence = 2;' KernelSU/kernel/feature/selinux_hide.c || {
              echo "错误：SukiSU fake status 未修正 sequence=0 指纹"; exit 1; }
            grep -qF 'define config_spoof' common/kernel/Makefile || {
              echo "错误：kernel/Makefile 未注入 config_data 伪装逻辑"; exit 1; }
            grep -qF 'KERNEL_CONFIG_SPOOF' common/kernel/Makefile || {
              echo "错误：kernel/Makefile 未支持 KERNEL_CONFIG_SPOOF"; exit 1; }

            echo "自检通过：两套 ABI 各自独立，SELinux policy/status 隐藏和 config_data 伪装均已补齐。"
          fi

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
        run: |
          set -euo pipefail
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace
          cp "${{ github.workspace }}/zram_patch/001-lz4.patch" ./common/
          cp "${{ github.workspace }}/zram_patch/lz4armv8.S" ./common/lib
          cp "${{ github.workspace }}/zram_patch/002-zstd.patch" ./common/
          cd ./common
          git apply -p1 < 001-lz4.patch
          patch -p1 < 002-zstd.patch

      - name: 应用 lz4kd 补丁
        if: inputs.lz4kd_enable
        run: |
          set -euo pipefail
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git
          cd common
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch

      - name: 添加SUSFS 配置项
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 添加 KSU & 其他配置项
        run: |
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" != "none" ]]; then
            echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "# CONFIG_KSU_DISABLE_POLICY is not set" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
              if [[ "${{ github.event.inputs.root_manager }}" == "none" ]]; then
                echo "错误：ksu_type=sukisu 需要 Manager 识别和 App Profile 授权，root_manager 不能选择 none。请改为 root_manager=default 后重新运行。"
                exit 1
              fi
              echo "# CONFIG_KSU_DISABLE_MANAGER is not set" >> ./common/arch/arm64/configs/gki_defconfig
              if [[ "${{ github.event.inputs.kpm_enable }}" == "true" ]]; then
                echo "CONFIG_KPM=y" >> ./common/arch/arm64/configs/gki_defconfig
                echo "CONFIG_KALLSYMS=y" >> ./common/arch/arm64/configs/gki_defconfig
                echo "CONFIG_KALLSYMS_ALL=y" >> ./common/arch/arm64/configs/gki_defconfig
              fi
            elif [[ "${{ github.event.inputs.root_manager }}" == "none" ]]; then
              echo "CONFIG_KSU_DISABLE_MANAGER=y" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi
          if [[ "${{ github.event.inputs.susfs_enable }}" == "false" ]]; then
            echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          #添加对 Mountify (backslashxx/mountify) 模块的支持
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == 'true' ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 开启O2编译优化配置
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          #禁用 defconfig 检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          #跳过将uapi标准头安装到 usr/include 目录的不必要操作，节省编译时间
          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          set -euo pipefail
          cd kernel_workspace
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd common
          cp "${{ github.workspace }}/other_patch/config.patch" ./config.patch
          patch -p1 -F 3 < config.patch || true

      - name: 添加 BBR 等一系列拥塞控制算法
        run: |
          if [[ "${{ github.event.inputs.bbr_enable }}" != "false" ]]; then
            echo "正在添加BBR等拥塞控制算法..."
            cd kernel_workspace
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用 Droidspaces 容器支持
        run: |
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            echo "正在启用 Droidspaces 容器支持..."
            cd kernel_workspace/common
            cp "${{ github.workspace }}/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch" ./fix_sysvipc_kabi_6_7_8.patch
            cp "${{ github.workspace }}/droidspaces_patch/fix_oplus_bsp_midas.patch" ./fix_oplus_bsp_midas.patch
            cp "${{ github.workspace }}/droidspaces_patch/ntsync_base.patch" ./ntsync_base.patch
            cp "${{ github.workspace }}/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch" ./ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
            patch -p1 -F 3 < ntsync_base.patch || true
            patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.droidspaces_enable }}" == "extend" ]]; then
              echo "正在启用容器环境扩展支持..."
              cp "${{ github.workspace }}/droidspaces_patch/evdi_drm.patch" ./evdi_drm.patch
              patch -p1 -F 3 < evdi_drm.patch || true
              echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> ./arch/arm64/configs/gki_defconfig
              echo "CONFIG_DRM_LINDROID_EVDI=y" >> ./arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用三星SSG IO调度器
        if: inputs.ssg_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_MQ_IOSCHED_SSG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_SSG_CGROUP=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用内核级基带保护
        if: inputs.baseband_guard
        run: |
          set -euo pipefail
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 添加制作名称
        env:
          KERNEL_SUFFIX_INPUT: ${{ github.event.inputs.kernel_suffix }}
        run: |
          set -euo pipefail
          cd kernel_workspace
          echo "替换内核版本后缀..."
          RAW_SUFFIX="${KERNEL_SUFFIX_INPUT:-}"
          if [[ -n "$RAW_SUFFIX" ]]; then
            if [[ "$RAW_SUFFIX" == -* ]]; then
              echo "错误：kernel_suffix 开头不要带连字符，workflow 会自动添加 '-'。"
              exit 1
            fi
            if [[ ! "$RAW_SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "错误：kernel_suffix 只能包含字母、数字、点、下划线和短横线，不能包含空格或 shell 保留字符。"
              exit 1
            fi
            FINAL_SUFFIX="$RAW_SUFFIX"
          else
            FINAL_SUFFIX="${{ env.KERNEL_NAME }}"
          fi
          echo "当前内核版本后缀：$FINAL_SUFFIX"
          echo "FINAL_SUFFIX=$FINAL_SUFFIX" >> $GITHUB_ENV
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${FINAL_SUFFIX}\"|" "$f"
          done

      - name: 构建内核
        run: |
          set -euo pipefail
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang20/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang20/bin"
          echo "编译器信息:"
          echo "Clang版本: $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD版本: $($CLANG_DIR/ld.lld --version | head -n 1)"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"

          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"

          cd kernel_workspace/common
          cp "${{ github.workspace }}/lib/libfakestat.so" ./libfakestat.so
          cp "${{ github.workspace }}/lib/libfaketimeMT.so" ./libfaketimeMT.so
          chmod 777 ./*.so
          export FAKESTAT="${{ env.RMX5062_KBUILD_BUILD_TIMESTAMP }}"
          export FAKETIME="@${{ env.RMX5062_KBUILD_BUILD_TIMESTAMP }}"
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          chmod +x cc-wrapper ld-wrapper

          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &

          KSU_MAKE_ARGS=()
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            KSU_MAKE_ARGS+=(
              KSU_VERSION="${SUKISU_KSU_VERSION}"
              KSU_VERSION_FULL="${SUKISU_FULL_VERSION}"
              VERSION_TAG="${SUKISU_TAG#v}"
              KSU_EXPECTED_SIZE=0x35c
              KSU_EXPECTED_HASH=947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
              KSU_MANAGER_PACKAGE=com.sukisu.ultra
            )
            echo "SukiSU 固定版本：${SUKISU_TAG}"
            echo "SukiSU 固定 KSU_VERSION：${SUKISU_KSU_VERSION}"
            echo "SukiSU 固定 Full Version：${SUKISU_FULL_VERSION}"
            echo "SukiSU Manager 包名：com.sukisu.ultra"
            echo "SukiSU Manager 签名 size：0x35c"
            echo "SukiSU Manager 签名 hash：947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef"
          fi

          KBUILD_MAKE_ARGS=(
            KBUILD_BUILD_USER="${{ env.RMX5062_KBUILD_BUILD_USER }}"
            KBUILD_BUILD_HOST="${{ env.RMX5062_KBUILD_BUILD_HOST }}"
            KBUILD_BUILD_TIMESTAMP="${{ env.RMX5062_KBUILD_BUILD_TIMESTAMP }}"
            KBUILD_BUILD_VERSION="${{ env.RMX5062_KBUILD_BUILD_VERSION }}"
          )
          echo "KBUILD 构建标识：${{ env.RMX5062_KBUILD_BUILD_USER }}@${{ env.RMX5062_KBUILD_BUILD_HOST }} / ${{ env.RMX5062_KBUILD_BUILD_TIMESTAMP }} / #${{ env.RMX5062_KBUILD_BUILD_VERSION }}"

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error "${KSU_MAKE_ARGS[@]}" "${KBUILD_MAKE_ARGS[@]}" gki_defconfig

          echo "====== SukiSU / Manager / Policy / SUSFS / Droidspaces 配置自检 ======"
          grep -E '^(CONFIG_KSU|CONFIG_KPM|CONFIG_KSU_SUSFS|CONFIG_TMPFS_XATTR|CONFIG_TMPFS_POSIX_ACL|CONFIG_PID_NS|CONFIG_IPC_NS|CONFIG_SYSVIPC|CONFIG_DEVTMPFS|CONFIG_NAMESPACES|CONFIG_USER_NS|CONFIG_POSIX_MQUEUE|CONFIG_NTSYNC)=' out/.config || true
          grep -E '^# CONFIG_KSU_DISABLE_(MANAGER|POLICY) is not set' out/.config || true
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "错误：CONFIG_KSU 未启用"; exit 1; }
            ! grep -q '^CONFIG_KSU_DISABLE_MANAGER=y' out/.config || { echo "错误：sukisu 分支不能启用 CONFIG_KSU_DISABLE_MANAGER，否则 Manager 无法识别"; exit 1; }
            ! grep -q '^CONFIG_KSU_DISABLE_POLICY=y' out/.config || { echo "错误：不能启用 CONFIG_KSU_DISABLE_POLICY，否则 App Profile 授权会被关闭"; exit 1; }
            if [[ "${{ github.event.inputs.kpm_enable }}" == "true" ]]; then
              grep -q '^CONFIG_KPM=y' out/.config || { echo "错误：kpm_enable=true 但 SukiSU CONFIG_KPM 未启用"; exit 1; }
            fi
          fi
          if [[ "${{ github.event.inputs.susfs_enable }}" == "true" && "${{ github.event.inputs.ksu_type }}" != "none" ]]; then
            grep -E '^(CONFIG_KSU_SUSFS|# CONFIG_KSU_SUSFS)' out/.config || true
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "错误：susfs_enable=true 但 CONFIG_KSU_SUSFS 未启用"; exit 1; }
          fi
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            for cfg in CONFIG_PID_NS CONFIG_IPC_NS CONFIG_SYSVIPC CONFIG_DEVTMPFS CONFIG_NAMESPACES CONFIG_USER_NS CONFIG_POSIX_MQUEUE CONFIG_NTSYNC; do
              grep -q "^${cfg}=y" out/.config || { echo "错误：Droidspaces 缺少 ${cfg}=y"; exit 1; }
            done
          fi

          KERNEL_CONFIG_SPOOF_VALUE="CONFIG_KSU=unset CONFIG_KPM=unset CONFIG_KSU_MANUAL_HOOK=unset CONFIG_KSU_SUSFS=unset CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=unset CONFIG_KSU_SUSFS_SUS_PATH=unset CONFIG_KSU_SUSFS_SUS_MOUNT=unset CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=unset CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=unset CONFIG_KSU_SUSFS_SUS_KSTAT=unset CONFIG_KSU_SUSFS_TRY_UMOUNT=unset CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=unset CONFIG_KSU_SUSFS_SPOOF_UNAME=unset CONFIG_KSU_SUSFS_ENABLE_LOG=unset CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=unset CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=unset CONFIG_KSU_SUSFS_OPEN_REDIRECT=unset CONFIG_KSU_SUSFS_SUS_MAP=unset CONFIG_KSU_SUSFS_SUS_SU=unset CONFIG_KALLSYMS_ALL=unset CONFIG_IP6_NF_NAT=n"
          KERNEL_CONFIG_SPOOF_ARGS=()
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            KERNEL_CONFIG_SPOOF_ARGS+=(KERNEL_CONFIG_SPOOF="$KERNEL_CONFIG_SPOOF_VALUE")
            echo "====== /proc/config.gz 展示伪装列表 ======"
            printf '%s\n' "$KERNEL_CONFIG_SPOOF_VALUE" | tr ' ' '\n'
          fi

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error "${KSU_MAKE_ARGS[@]}" "${KBUILD_MAKE_ARGS[@]}" "${KERNEL_CONFIG_SPOOF_ARGS[@]}" Image
          test -f out/arch/arm64/boot/Image

          echo "====== KBUILD / UTS 构建元数据自检 ======"
          for meta in out/include/generated/compile.h out/include/generated/utsrelease.h out/include/generated/utsversion.h; do
            if [[ -f "$meta" ]]; then
              echo "--- $meta ---"
              cat "$meta"
              ! grep -Eiq 'runner@|/home/runner|github-actions|actions/runner|fv-az|-dirty' "$meta" || { echo "错误：$meta 暴露 CI/dirty 构建指纹"; exit 1; }
            else
              echo "提示：$meta 不存在，跳过。"
            fi
          done
          grep -qF 'LINUX_COMPILE_BY "${{ env.RMX5062_KBUILD_BUILD_USER }}"' out/include/generated/compile.h || { echo "错误：compile.h 的构建用户不符合预期"; exit 1; }
          grep -qF 'LINUX_COMPILE_HOST "${{ env.RMX5062_KBUILD_BUILD_HOST }}"' out/include/generated/compile.h || { echo "错误：compile.h 的构建主机不符合预期"; exit 1; }
          grep -qF "UTS_RELEASE \"${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${FINAL_SUFFIX}\"" out/include/generated/utsrelease.h || { echo "错误：utsrelease.h 与目标内核版本后缀不一致"; exit 1; }
          EXPECTED_UTS_TIME="$(TZ='${{ env.TZ }}' date -d '${{ env.RMX5062_KBUILD_BUILD_TIMESTAMP }}' '+%H:%M:%S')"
          EXPECTED_UTS_YEAR="$(TZ='${{ env.TZ }}' date -d '${{ env.RMX5062_KBUILD_BUILD_TIMESTAMP }}' '+%Y')"
          META_TIME_FILES=(out/include/generated/compile.h)
          [[ -f out/include/generated/utsversion.h ]] && META_TIME_FILES+=(out/include/generated/utsversion.h)
          if ! grep -qs "$EXPECTED_UTS_TIME" "${META_TIME_FILES[@]}" || ! grep -qs "$EXPECTED_UTS_YEAR" "${META_TIME_FILES[@]}"; then
            echo "错误：generated header 未使用预期 KBUILD 构建时间"
            exit 1
          fi

          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            echo "====== Image 内嵌 config 展示面自检 ======"
            bash scripts/extract-ikconfig out/arch/arm64/boot/Image > out/image.config
            for rule in $KERNEL_CONFIG_SPOOF_VALUE; do
              cfg="${rule%%=*}"
              val="${rule#*=}"
              if [[ "$val" == "unset" || "$val" == "n" ]]; then
                ! grep -q "^${cfg}=" out/image.config || { echo "错误：Image 内嵌 config 仍暴露 ${cfg} 的启用值：$(grep -m1 "^${cfg}=" out/image.config)"; exit 1; }
                if grep -q "^# ${cfg} is not set" out/image.config; then
                  echo "确认：${cfg} 已展示为未启用。"
                else
                  echo "提示：${cfg} 不在 Image 内嵌 config 中，按 config_spoof 规则视为无暴露。"
                fi
              else
                grep -q "^${cfg}=${val}$" out/image.config || { echo "错误：Image 内嵌 config 未把 ${cfg} 伪装成 ${val}"; exit 1; }
              fi
            done
            echo "Image 内嵌 config 自检通过：KERNEL_CONFIG_SPOOF 列表均已按预期展示。"
          fi

          echo "内核编译完成。"
          ccache -s
          df -h

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 应用KPM并修补内核
        if: inputs.kpm_enable
        run: |
          set -euo pipefail
          echo "正在应用KP-N并修补内核..."
          cd kernel_workspace/common/out/arch/arm64/boot
          test -s Image || { echo "错误：KPM 修补前 Image 不存在或为空"; exit 1; }
          IMAGE_BEFORE_SIZE=$(stat -c '%s' Image)
          echo "KPM 修补前 Image 大小：${IMAGE_BEFORE_SIZE}"
          echo "KPM_IMAGE_BEFORE_SIZE=${IMAGE_BEFORE_SIZE}" >> $GITHUB_ENV
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          chmod +x ./kptools-linux
          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          test -s oImage || { echo "错误：KPM 修补后的 oImage 不存在或为空"; exit 1; }
          rm -f Image
          mv oImage Image
          test -s Image || { echo "错误：KPM 修补后的最终 Image 不存在或为空"; exit 1; }
          IMAGE_AFTER_SIZE=$(stat -c '%s' Image)
          echo "KPM 修补后 Image 大小：${IMAGE_AFTER_SIZE}"
          echo "KPM_IMAGE_AFTER_SIZE=${IMAGE_AFTER_SIZE}" >> $GITHUB_ENV
          if [[ "$IMAGE_AFTER_SIZE" -le 10485760 ]]; then
            echo "错误：KPM 修补后的 Image 异常过小"
            exit 1
          fi
          if strings Image | grep -Eiq 'runner@|/home/runner|github-actions|actions/runner|fv-az|-dirty'; then
            echo "错误：KPM 后最终 Image 暴露 CI/dirty 构建指纹"
            exit 1
          fi

      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          test -s ../common/out/arch/arm64/boot/Image || { echo "错误：打包前最终 Image 不存在或为空"; exit 1; }
          FINAL_IMAGE_SIZE=$(stat -c '%s' ../common/out/arch/arm64/boot/Image)
          cp ../common/out/arch/arm64/boot/Image ./Image
          test -s ./Image || { echo "错误：AnyKernel3/Image 不存在或为空"; exit 1; }
          AK3_IMAGE_SIZE=$(stat -c '%s' ./Image)
          echo "打包 Image 大小：${AK3_IMAGE_SIZE}"
          if [[ "$FINAL_IMAGE_SIZE" != "$AK3_IMAGE_SIZE" ]]; then
            echo "错误：AnyKernel3/Image 大小与最终 Image 不一致"
            exit 1
          fi
          if [[ "${{ github.event.inputs.kpm_enable }}" == 'true' && -n "${KPM_IMAGE_AFTER_SIZE:-}" && "$AK3_IMAGE_SIZE" != "$KPM_IMAGE_AFTER_SIZE" ]]; then
            echo "错误：AnyKernel3/Image 不是 KPM 修补后的最终 Image"
            exit 1
          fi

          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi
          KSUVER="${KSUVER:-none}"
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == 'true' ]]; then
            cp "${{ github.workspace }}/zram.zip" ./zram.zip
          fi
          if [[ "${{ github.event.inputs.kpm_enable }}" == 'true' ]]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FINAL_SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          else
            FINAL_SUFFIX="${{ env.KERNEL_NAME }}"
          fi

          FINAL_SUFFIX="${FINAL_SUFFIX:-${{ env.KERNEL_NAME }}}"
          if [[ "$FINAL_SUFFIX" == -* || ! "$FINAL_SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "错误：最终 kernel_suffix 不合法，停止打包。"
            exit 1
          fi
          FEATURE_TAGS=""
          [[ "${{ github.event.inputs.root_manager }}" == "none" ]] && FEATURE_TAGS="${FEATURE_TAGS}_mgrnone"
          [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]] && FEATURE_TAGS="${FEATURE_TAGS}_dss"
          [[ "${{ github.event.inputs.kpm_enable }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_kpm"
          [[ "${{ github.event.inputs.lz4_enable }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_lz4"
          [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_lz4kd"
          [[ "${{ github.event.inputs.better_net }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_net"
          [[ "${{ github.event.inputs.rekernel_enable }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_rek"
          [[ "${{ github.event.inputs.baseband_guard }}" == "true" ]] && FEATURE_TAGS="${FEATURE_TAGS}_bbg"

          AK3_NAME="AnyKernel3_${{ env.DEVICE_MODEL }}_${KSU_TYPENAME}_${KSUVER}_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}_${FINAL_SUFFIX}${FEATURE_TAGS}.zip"
          FULL_VERSION="${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${FINAL_SUFFIX}"
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT
          echo "ak3dir=kernel_workspace/AnyKernel3" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          cat > ./ak3.log <<EOF
          Author: $GITHUB_ACTOR
          Repo: $GITHUB_REPOSITORY
          Branch: $GITHUB_REF_NAME
          Run ID: $GITHUB_RUN_ID
          Commit: $GITHUB_SHA
          Time: $TIME_NOW
          Device: ${{ env.DEVICE_NAME }} / ${{ env.DEVICE_MODEL }} / ${{ env.DEVICE_BOARD }}
          Source: ${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_REF }}
          Source Commit: ${SOURCE_COMMIT:-unknown}
          Kernel Ver: $FULL_VERSION
          KSU Branch: ${KSU_TYPENAME}
          KSU Ver: ${KSUVER}
          Root Manager Input: ${{ github.event.inputs.root_manager }}
          susfs: ${{ github.event.inputs.susfs_enable }}
          KPM: ${{ github.event.inputs.kpm_enable }}
          LZ4: ${{ github.event.inputs.lz4_enable }}
          LZ4KD: ${{ github.event.inputs.lz4kd_enable }}
          IPset: ${{ github.event.inputs.better_net }}
          BBR&Brutal: ${{ github.event.inputs.bbr_enable }}
          Droidspaces: ${{ github.event.inputs.droidspaces_enable }}
          SSG: ${{ github.event.inputs.ssg_enable }}
          Re-Kernel: ${{ github.event.inputs.rekernel_enable }}
          BBG: ${{ github.event.inputs.baseband_guard }}
          EOF
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            cat >> ./ak3.log <<'EOF'
          SukiSU Fixed Tag: v4.1.3
          SukiSU Manager Package: com.sukisu.ultra
          SukiSU Manager Signature Size: 0x35c
          SukiSU Manager Signature Hash: 947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
          SukiSU Manager Recognition: forced enabled for sukisu
          SukiSU Policy/App Profile: forced enabled for sukisu
          SukiSU Notice: use official SukiSU Ultra v4.1.3 Manager for first App root authorization
          EOF
          fi
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 上传 Ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-log-rmx5062
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
          if-no-files-found: warn

      - name: 上传 AnyKernel3 一层工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: |
            ${{ github.workspace }}/${{ steps.create_zip.outputs.ak3dir }}/*
            !${{ github.workspace }}/${{ steps.create_zip.outputs.ak3dir }}/.git/**
          if-no-files-found: error

      - name: 上传 Release 专用 ZIP 工件
        if: inputs.release_enable
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.create_zip.outputs.ak3name }}
          path: ${{ github.workspace }}/kernel_workspace/${{ steps.create_zip.outputs.ak3name }}
          if-no-files-found: error

  release:
    if: inputs.release_enable
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.ak3name }}
          path: ./release_zips

      - name: 设置环境变量
        run: |
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          echo "TAG_HEAD=RMX5062-build" >> $GITHUB_ENV
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            KSU_TYPENAME="KernelSU (Official)"
          else
            KSU_TYPENAME="无内置KSU"
          fi
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV

      - name: 创建发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << EOF > release_notes.md
          ### 📱 ${{ env.DEVICE_NAME }} / ${{ env.DEVICE_MODEL }} 官方 OKI 内核 | 构建信息
          - 内核版本号: ${{ needs.build.outputs.full_version }}
          - 编译时间: ${{ env.TIME_FORM }}
          - 机型：${{ env.DEVICE_NAME }} / ${{ env.DEVICE_MODEL }} / ${{ env.DEVICE_BOARD }}
          - 官方源码：${{ env.SOURCE_REPO }}
          - 源码分支：${{ env.SOURCE_REF }}
          - 源码提交：${{ needs.build.outputs.source_commit }}
          - KSU分支：${{ env.KSU_TYPENAME }}
          - KSU版本：${{ needs.build.outputs.ksuver }}
          - Root管理器集成：${{ github.event.inputs.root_manager }}
          - SukiSU固定版本：ksu_type=sukisu 时固定 SukiSU Ultra v4.1.3 / KSUVER 40796（与官方 Manager versionCode 一致）
          - SukiSU Manager识别：ksu_type=sukisu 时固定包名 com.sukisu.ultra，签名 0x35c / 947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
          - SukiSU授权策略：ksu_type=sukisu 时强制保留 Manager 识别和 App Profile，不启用 CONFIG_KSU_DISABLE_MANAGER / CONFIG_KSU_DISABLE_POLICY
          - susfs支持：${{ github.event.inputs.susfs_enable }}
          - KPM支持：${{ github.event.inputs.kpm_enable }}
          - LZ4支持：${{ github.event.inputs.lz4_enable }}
          - LZ4KD支持：${{ github.event.inputs.lz4kd_enable }}
          - 网络功能增强：${{ github.event.inputs.better_net }}
          - BBR/Brutal 等拥塞控制算法支持：${{ github.event.inputs.bbr_enable }}
          - Droidspaces 容器支持：${{ github.event.inputs.droidspaces_enable }}
          - 三星SSG IO调度器支持：${{ github.event.inputs.ssg_enable }}
          - Re-Kernel支持：${{ github.event.inputs.rekernel_enable }}
          - 内核级基带保护支持：${{ github.event.inputs.baseband_guard }}

          ### 📋 安装方法
          1. 本产物是 AnyKernel3 可刷 zip，不是完整 boot.img。
          2. 刷入前请确认设备为 realme Neo7 Turbo / RMX5062，当前系统为 Android 15 且内核线为 6.1.115 / android14-6.1。
          3. 刷入前务必备份当前槽位 boot，建议同时保留 stock init_boot/vendor_boot/dtbo/vbmeta 等镜像。
          4. 有 root 时可使用 KernelFlasher/HorizonKernelFlasher 刷入 AnyKernel3 包；有第三方 Recovery 时也可在 Recovery 中刷入。
          5. ksu_type=sukisu 时请使用官方 SukiSU Ultra v4.1.3 Manager 首次验证 App root 授权，不要使用 ReSukiSU Manager 或重签 APK 验证 SukiSU 首次授权。
          6. 若启用 Droidspaces，建议先使用 standard，不建议第一次直接刷 extend。
          7. 如出现 bootloop，请进 fastboot 刷回备份或线刷包中的 stock boot.img。

          #### ※※※刷写内核有风险，确认备份和救砖路径后再操作。※※※
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.DEVICE_MODEL }} ${{ needs.build.outputs.full_version }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
